name: default
description: "Default preset - base configuration for interactive queries"

dataset:
  collection_name: wiki_10k_qdrant_cs512_co50_minilm_l6_cosine
  dataset_name: wiki_10k
  questions_file: data/evaluation/eval_10k_200q.json

embedding:
  dimension: 384
  model_name: sentence-transformers/all-MiniLM-L6-v2

chunking:
  chunk_overlap: 128
  chunk_size: 512

retrieval:
  dense_weight: 0.7
  fusion_method: rrf
  rerank_k: 20
  sparse_weight: 0.3
  technique: vanilla
  top_k: 100

reranker:
  model_name: cross-encoder/ms-marco-MiniLM-L-12-v2
  type: cross_encoder

generation:
  enabled: true
  llm_provider: openrouter
  max_tokens: 512
  model: z-ai/glm-5.3-flash
  temperature: 0.0
  top_k_chunks: 20

evaluation:
  compute_answer_correctness: true
  use_jev_judge: true
  jev_threshold: 0.5
  hit_token_budgets:
  - 4000
  - 8000
  compute_context_precision: false
  compute_entity_metrics: false
  compute_ragas: false
  k_values:
  - 1
  - 3
  - 5
  - 10

vector_db:
  backend: qdrant
  connection_params: null
  distance_metric: cosine
