# Model pricing catalog (E9-F1-T1).
#
# Edited by hand. Used for every cost estimate and budget check (AutoML).
# Prices are per 1 million tokens, in `currency`. A price left at `null` means
# "unknown": estimates that need it report the model as unpriced instead of
# guessing. No default price is shipped on purpose: copy current prices from
# the provider's pricing page and set `checked` to the date you checked them.
#
# API models (kind: llm)
#   input_per_1m / output_per_1m: price per 1M input / output tokens
#   roles: where the model is used (generation, judge, ragas, entity_extraction,
#          dataset_generation, assistant)
# Local models (kind: embedding | reranker)
#   No API price. `seconds_per_1k_items` is an optional local compute-time
#   estimate (1k chunks embedded, or 1k query/chunk pairs reranked), measured
#   on your machine.
#
# Free models: set both prices to 0.

currency: USD

models:
  # --- Answer generation ----------------------------------------------------
  z-ai/glm-5.3-flash:
    kind: llm
    provider: openrouter
    roles: [generation]
    input_per_1m: null
    output_per_1m: null
    checked: null
  nvidia/nemotron-3-nano-30b-a3b:
